name: Download authorized video for Adobe

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: YouTube video URL (only content you own or are authorized to download)
        required: true
        type: string
        default: https://youtu.be/mskEXYqt9ak?si=1xf5cUsKDHdeuIhf
      rights_confirmed:
        description: I own this video or have explicit permission to download and edit it
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  prepare-mp4:
    name: Prepare Adobe-compatible 720p MP4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm download rights
        env:
          RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
        run: |
          if [[ "$RIGHTS_CONFIRMED" != "true" ]]; then
            echo "Stop: confirm that you own this video or have explicit permission to download and edit it." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Download and convert
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: python scripts/download_for_adobe.py "$VIDEO_URL"

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: adobe-720p-mp4
          path: output/adobe_720p.mp4
          if-no-files-found: error
          retention-days: 2
